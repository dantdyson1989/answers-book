<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>答案之书 · 紫魔法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0d0616;
    --plum: #1b0f33;
    --violet: #8b5cf6;
    --amethyst: #a855f7;
    --lavender: #c4b5fd;
    --lilac: #ddd0fb;
    --pale: #f1ebfd;
    --dim: #a68fd6;
    --faint: #7c68ab;
  }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 520px at 50% -8%, rgba(139, 92, 246, .34) 0%, rgba(139, 92, 246, 0) 60%),
      radial-gradient(700px 500px at 88% 108%, rgba(168, 85, 247, .16) 0%, rgba(168, 85, 247, 0) 60%),
      radial-gradient(600px 420px at 8% 96%, rgba(109, 40, 217, .18) 0%, rgba(109, 40, 217, 0) 60%),
      radial-gradient(1200px 800px at 50% -10%, #2a1052 0%, #150a2a 55%, var(--ink) 100%);
    background-color: var(--ink);
    color: var(--pale);
    font-family: "Cormorant Garamond", "Noto Serif SC", "Songti SC", serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 52px 20px 36px;
    position: relative;
  }
  /* floating star dust, generated by script */
  .sparkle-field { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sparkle-field span {
    position: absolute; color: var(--lavender); line-height: 1;
    text-shadow: 0 0 8px rgba(196, 181, 253, .9), 0 0 20px rgba(168, 85, 247, .55);
    animation: twinkle ease-in-out infinite alternate, drift linear infinite;
    opacity: 0;
  }
  @keyframes twinkle { from { opacity: .08; transform: scale(.7) rotate(0deg); } to { opacity: .95; transform: scale(1.15) rotate(40deg); } }
  @keyframes drift { from { margin-top: 0; } to { margin-top: -46px; } }

  header, .book, .api, .foot { position: relative; z-index: 1; }
  header { text-align: center; }
  .moons { color: var(--lavender); font-size: 1.05rem; letter-spacing: .9em; text-indent: .9em; text-shadow: 0 0 14px rgba(168, 85, 247, .8); }
  h1 {
    margin-top: 12px; font-size: 2.6rem; font-weight: 900; letter-spacing: .35em; text-indent: .35em;
    color: var(--pale);
    text-shadow: 0 0 18px rgba(168, 85, 247, .65), 0 0 46px rgba(139, 92, 246, .4);
  }
  .sub { margin-top: 12px; color: var(--dim); font-size: 1rem; letter-spacing: .22em; }
  .sub .star { color: var(--lavender); text-shadow: 0 0 10px rgba(168, 85, 247, .9); }

  .book {
    margin-top: 42px; width: min(560px, 92vw);
    background: linear-gradient(165deg, rgba(46, 24, 92, .92), rgba(22, 11, 46, .96));
    border: 1px solid rgba(167, 139, 250, .55); border-radius: 16px;
    box-shadow: 0 0 70px rgba(139, 92, 246, .30), 0 0 26px rgba(168, 85, 247, .18), inset 0 0 46px rgba(10, 4, 24, .55), inset 0 1px 0 rgba(221, 208, 251, .14);
    padding: 38px 32px 30px; text-align: center;
    overflow: hidden;
  }
  .book::before, .book::after {
    content: "✦"; position: absolute; color: rgba(196, 181, 253, .5); font-size: .95rem;
    text-shadow: 0 0 10px rgba(168, 85, 247, .8);
  }
  .book::before { top: 10px; left: 14px; }
  .book::after { bottom: 10px; right: 14px; }
  .book.casting { animation: castingPulse 1.15s ease-in-out infinite; }
  @keyframes castingPulse {
    0%, 100% { box-shadow: 0 0 70px rgba(139, 92, 246, .30), 0 0 26px rgba(168, 85, 247, .18), inset 0 0 46px rgba(10, 4, 24, .55); }
    50% { box-shadow: 0 0 110px rgba(168, 85, 247, .55), 0 0 44px rgba(196, 181, 253, .35), inset 0 0 60px rgba(88, 40, 180, .35); }
  }

  input {
    width: 100%; padding: 14px 16px; font-size: 1.08rem;
    background: rgba(196, 181, 253, .06); color: var(--pale);
    border: 1px solid rgba(167, 139, 250, .5); border-radius: 10px; outline: none;
    font-family: inherit; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input:focus { border-color: var(--lavender); background: rgba(196, 181, 253, .1); box-shadow: 0 0 0 3px rgba(168, 85, 247, .22), 0 0 22px rgba(139, 92, 246, .35); }
  input::placeholder { color: var(--faint); }
  button {
    margin-top: 20px; padding: 14px 46px; font-size: 1.18rem; letter-spacing: .3em; text-indent: .3em;
    font-family: inherit; font-weight: 600; cursor: pointer; color: #f6f1ff;
    background: linear-gradient(180deg, #a678ff, #7c3aed 55%, #6d28d9);
    border: 1px solid rgba(221, 208, 251, .65); border-radius: 999px;
    box-shadow: 0 6px 26px rgba(124, 58, 237, .5), 0 0 18px rgba(168, 85, 247, .35), inset 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 12px 34px rgba(124, 58, 237, .6), 0 0 34px rgba(168, 85, 247, .6), inset 0 1px 0 rgba(255, 255, 255, .4); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: .55; cursor: wait; transform: none; filter: saturate(.6); }

  .answer {
    margin-top: 30px; min-height: 132px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  .runes {
    position: absolute; left: 50%; top: 50%; width: 252px; height: 252px;
    transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none;
    transition: opacity .8s ease;
  }
  .runes svg { width: 100%; height: 100%; animation: spin 46s linear infinite; filter: drop-shadow(0 0 7px rgba(168, 85, 247, .65)); }
  .runes text { fill: var(--lavender); font-size: 15px; letter-spacing: 6px; }
  .runes .ring { fill: none; stroke: rgba(196, 181, 253, .75); }
  .answer.reveal .runes { opacity: .5; }
  .book.casting .runes { opacity: .3; }
  .book.casting .runes svg { animation-duration: 7s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .answer .text {
    position: relative; z-index: 1;
    font-size: 2.05rem; font-weight: 900; line-height: 1.4; color: var(--pale);
    text-shadow: 0 0 16px rgba(196, 181, 253, .75), 0 0 42px rgba(168, 85, 247, .55);
  }
  .answer.reveal .text { animation: materialize .95s cubic-bezier(.22, .8, .3, 1) both; }
  @keyframes materialize {
    0% { opacity: 0; transform: translateY(16px) scale(.92); filter: blur(10px); text-shadow: 0 0 60px rgba(217, 70, 239, .9), 0 0 90px rgba(168, 85, 247, .9); }
    55% { opacity: 1; filter: blur(0); text-shadow: 0 0 30px rgba(217, 70, 239, .75), 0 0 60px rgba(168, 85, 247, .8); }
    100% { opacity: 1; transform: none; filter: blur(0); text-shadow: 0 0 16px rgba(196, 181, 253, .75), 0 0 42px rgba(168, 85, 247, .55); }
  }
  .answer .tag {
    position: relative; z-index: 1;
    font-size: .82rem; letter-spacing: .28em; color: var(--lilac);
    border: 1px solid rgba(167, 139, 250, .65); border-radius: 999px; padding: 5px 16px 5px 20px;
    background: rgba(139, 92, 246, .12); box-shadow: 0 0 14px rgba(139, 92, 246, .3), inset 0 0 10px rgba(139, 92, 246, .18);
  }
  .answer.reveal .tag { animation: fadeUp .8s ease .3s both; }
  .answer .q { position: relative; z-index: 1; color: var(--dim); font-size: .98rem; max-width: 90%; word-break: break-all; }
  .answer.reveal .q { animation: fadeUp .8s ease .45s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .answer .hint { color: var(--faint); font-size: 1.02rem; letter-spacing: .12em; }
  .burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 2; pointer-events: none; }
  .burst span {
    position: absolute; left: 0; top: 0; color: var(--lavender); line-height: 1;
    text-shadow: 0 0 10px rgba(196, 181, 253, 1), 0 0 24px rgba(217, 70, 239, .7);
    animation: burstFly 1.05s cubic-bezier(.17, .67, .35, 1) forwards;
  }
  @keyframes burstFly {
    0% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0deg); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(var(--rot)); }
  }

  .history { margin-top: 28px; text-align: left; font-size: .94rem; color: var(--dim); }
  .history h2 { font-size: .86rem; letter-spacing: .3em; color: var(--faint); margin-bottom: 8px; font-weight: 400; }
  .history li { list-style: none; padding: 6px 0; border-bottom: 1px dashed rgba(167, 139, 250, .28); }
  .history li span { color: var(--lavender); text-shadow: 0 0 8px rgba(168, 85, 247, .45); }
  .api {
    margin-top: 42px; width: min(560px, 92vw);
    background: rgba(196, 181, 253, .045); border: 1px solid rgba(124, 92, 200, .4); border-radius: 12px;
    padding: 20px 22px; font-size: .94rem; color: var(--dim);
  }
  .api h2 { font-size: .92rem; letter-spacing: .3em; color: var(--lavender); margin-bottom: 12px; font-weight: 600; }
  .api code {
    display: block; background: rgba(8, 3, 18, .6); border: 1px solid rgba(124, 92, 200, .25); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; color: #d9ccf7; font-size: .84rem;
    overflow-x: auto; white-space: nowrap; font-family: ui-monospace, monospace;
  }
  .foot { margin-top: 30px; color: var(--faint); font-size: .84rem; letter-spacing: .16em; text-align: center; }
  .foot a { color: var(--dim); }
  @media (max-width: 480px) {
    h1 { font-size: 2rem; }
    .book { padding: 30px 20px 24px; }
    .answer .text { font-size: 1.7rem; }
    .runes { width: 210px; height: 210px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .runes svg, .sparkle-field span, .book.casting { animation: none !important; }
    .answer.reveal .text, .answer.reveal .tag, .answer.reveal .q { animation-duration: .01s; }
  }
</style>
</head>
<body>
  <div class="sparkle-field" id="sparkles" aria-hidden="true"></div>

  <header>
    <p class="moons">☾ ✦ ☽</p>
    <h1>答案之书</h1>
    <p class="sub"><span class="star">✦</span> 心中默念一个问题，然后翻开它 <span class="star">✦</span></p>
  </header>

  <div class="book" id="book">
    <input id="q" type="text" maxlength="120" placeholder="把你的问题写在这里，比如：今天适合出门吗？" autocomplete="off">
    <br>
    <button id="ask">翻开答案</button>
    <div class="answer" id="answer">
      <div class="runes" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <defs><path id="runepath" d="M100,100 m-76,0 a76,76 0 1,1 152,0 a76,76 0 1,1 -152,0"/></defs>
          <circle class="ring" cx="100" cy="100" r="90" stroke-width="1" stroke-dasharray="3 7"/>
          <circle class="ring" cx="100" cy="100" r="62" stroke-width="1" opacity=".6"/>
          <text><textPath href="#runepath">✦ ☾ ✧ ❖ ☽ ✦ ☾ ✧ ❖ ☽ ✦ ☾ ✧ ❖ ☽</textPath></text>
        </svg>
      </div>
      <p class="hint">书页尚未翻开</p>
    </div>
    <div class="history" id="history" hidden>
      <h2>最近的答案</h2>
      <ul id="historyList"></ul>
    </div>
  </div>

  <div class="api">
    <h2>✦ API 玩法</h2>
    随机取一个答案：
    <code>curl <span id="base1"></span>/api/answer?q=今天适合出门吗</code>
    取全部答案列表：
    <code>curl <span id="base2"></span>/api/answers</code>
  </div>

  <p class="foot">☾ 跑在 Cloady 免费层 · 共 <span id="total">64</span> 条答案 ☽</p>

<script>
  const $ = (id) => document.getElementById(id);
  const base = location.origin;
  $("base1").textContent = base;
  $("base2").textContent = base;

  // --- star dust field (presentational only) ---
  (function () {
    const field = $("sparkles");
    const glyphs = ["✦", "✧", "·", "✦", "☾"];
    let html = "";
    for (let i = 0; i < 26; i++) {
      const x = (Math.random() * 100).toFixed(2);
      const y = (Math.random() * 100).toFixed(2);
      const size = (9 + Math.random() * 11).toFixed(0);
      const tw = (2.4 + Math.random() * 3.6).toFixed(2);
      const dr = (11 + Math.random() * 16).toFixed(1);
      const delay = (-Math.random() * 8).toFixed(2);
      html += '<span style="left:' + x + '%;top:' + y + '%;font-size:' + size +
        'px;animation-duration:' + tw + 's,' + dr + 's;animation-delay:' + delay + 's,' + delay + 's">' +
        glyphs[i % glyphs.length] + "</span>";
    }
    field.innerHTML = html;
  })();

  // --- sparkle burst on reveal (presentational only) ---
  function burst(box) {
    const old = box.querySelector(".burst");
    if (old) old.remove();
    const layer = document.createElement("div");
    layer.className = "burst";
    const glyphs = ["✦", "✧", "❖", "✦"];
    let html = "";
    for (let i = 0; i < 12; i++) {
      const ang = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
      const dist = 74 + Math.random() * 66;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 14;
      const size = (11 + Math.random() * 10).toFixed(0);
      const rot = (Math.random() * 160 - 80).toFixed(0);
      html += '<span style="--dx:' + dx.toFixed(0) + 'px;--dy:' + dy.toFixed(0) +
        'px;--rot:' + rot + 'deg;font-size:' + size + 'px;animation-delay:' + (Math.random() * 0.12).toFixed(2) + 's">' +
        glyphs[i % glyphs.length] + "</span>";
    }
    layer.innerHTML = html;
    box.appendChild(layer);
    setTimeout(() => layer.remove(), 1600);
  }

  const historyBox = $("history"), historyList = $("historyList");
  let history = [];
  try { history = JSON.parse(localStorage.getItem("answers-book-history") || "[]"); } catch (e) {}
  function renderHistory() {
    if (!history.length) { historyBox.hidden = true; return; }
    historyBox.hidden = false;
    historyList.innerHTML = history.map(h =>
      `<li><span>${h.answer}</span>　${h.question ? "— " + h.question : ""}</li>`).join("");
  }
  renderHistory();

  let timer = null;
  async function ask() {
    const btn = $("ask"), box = $("answer"), book = $("book");
    const q = $("q").value.trim();
    btn.disabled = true;
    box.classList.remove("reveal");
    book.classList.add("casting");
    box.innerHTML = '<p class="hint">书页翻动中……</p>';
    // shuffle a few decoys, then settle on the real answer
    const res = await fetch("/api/answer?q=" + encodeURIComponent(q));
    const data = await res.json();
    const decoys = ["正在聆听……", "星星在排列……", "书页在翻动……"];
    let i = 0;
    clearInterval(timer);
    timer = setInterval(() => {
      box.innerHTML = '<p class="hint">' + decoys[i % decoys.length] + "</p>";
      i++;
      if (i > 4) {
        clearInterval(timer);
        book.classList.remove("casting");
        box.innerHTML =
          '<div class="runes" aria-hidden="true"><svg viewBox="0 0 200 200"><defs><path id="runepath" d="M100,100 m-76,0 a76,76 0 1,1 152,0 a76,76 0 1,1 -152,0"/></defs><circle class="ring" cx="100" cy="100" r="90" stroke-width="1" stroke-dasharray="3 7"/><circle class="ring" cx="100" cy="100" r="62" stroke-width="1" opacity=".6"/><text><textPath href="#runepath">✦ ☾ ✧ ❖ ☽ ✦ ☾ ✧ ❖ ☽ ✦ ☾ ✧ ❖ ☽</textPath></text></svg></div>' +
          '<p class="text">' + data.answer + "</p>" +
          '<p class="tag">' + data.category + "</p>" +
          (q ? '<p class="q">“' + q.replace(/</g, "&lt;") + "”</p>" : "");
        box.classList.add("reveal");
        burst(box);
        btn.disabled = false;
        history.unshift({ question: q, answer: data.answer });
        history = history.slice(0, 5);
        try { localStorage.setItem("answers-book-history", JSON.stringify(history)); } catch (e) {}
        renderHistory();
      }
    }, 320);
  }

  $("ask").addEventListener("click", ask);
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  fetch("/api/answers").then(r => r.json()).then(d => { $("total").textContent = d.total; }).catch(() => {});
</script>
</body>
</html>
